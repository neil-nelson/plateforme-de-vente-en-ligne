<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Main - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }
        
        .message.error {
            background-color: #fdedec;
            color: #e74c3c;
            border: 1px solid #fadbd8;
        }
        
        .message.success {
            background-color: #e8f6f3;
            color: #27ae60;
            border: 1px solid #d4efdf;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="icon-wrapper">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <h1>Connexion</h1>
                <p>Accédez à votre compte Second Main</p>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="login-username">
                        <i class="fas fa-user"></i> Pseudo
                    </label>
                    <input 
                        type="text" 
                        id="login-username" 
                        placeholder="Entrez votre pseudo" 
                        required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="login-password">
                        <i class="fas fa-lock"></i> Mot de passe
                    </label>
                    <input 
                        type="password" 
                        id="login-password" 
                        placeholder="Entrez votre mot de passe" 
                        required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Se connecter
                </button>
            </form>

            <div class="divider">
                <span>ou</span>
            </div>

            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Retour à l'accueil
            </a>

            <div class="auth-footer">
                <p>Pas encore de compte ? <a href="register.html">Inscrivez-vous</a></p>
            </div>

            <div class="admin-access" style="text-align: center; margin-top: 20px;">
                <p style="font-size: 14px; color: #7f8c8d;">
                    Accès administrateur? 
                    <a href="admin-login.html" style="color: #3498db; font-weight: 500;">
                        <i class="fa-solid fa-user-shield"></i> Connexion admin
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
